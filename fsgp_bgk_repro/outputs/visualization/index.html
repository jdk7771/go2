<!doctype html>
<html lang="zh-CN"><head><base href="./metrics/"><meta name="go2-metric-home" content="42482">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地形评价 · 局部二次曲面</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="./viewer.css?v=14">
<script type="importmap">{"imports":{"three":"../scene-fits/vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"../scene-fits/vendor/OrbitControls.js"}}</script>
<script>
const oldQuery=new URLSearchParams(location.search);
if(!oldQuery.has('metric')&&['color','surface','view','only','seed','overlay','neighbors'].some(k=>oldQuery.has(k))){window.metricLegacyRedirect=true;const oldPage=new URL('../scene-fits/',document.baseURI);oldPage.search=location.search;oldPage.hash=location.hash;location.replace(oldPage);}
</script>
</head><body><main>
<header><div><h1>地形评价</h1><p>局部二次曲面 · 凸多边形裁剪 · 六项指标采用统一定义</p></div><a id="planner-link" href="../surface-planner/">分层路径规划 ↗</a><a id="details-link" href="../convex-assessment/report.md">指标计算说明 ↗</a></header>
<section class="controls" aria-label="场景与指标">
 <label>场景<select id="scene-select" aria-label="选择场景"></select></label>
 <label>拟合设置<select id="profile-select" aria-label="选择拟合设置"></select></label>
 <label>评价指标<select id="metric-select" aria-label="选择评价指标"></select></label>
 <div class="angles" aria-label="视角"><button data-angle="3d" class="active">三维</button><button data-angle="top">俯视</button><button data-angle="side">侧视</button></div>
</section>
<section class="readout" aria-label="当前指标数值">
 <div><span>平均值（有效函数）</span><strong id="mean-value">—</strong></div>
 <div><span>最大值（有效函数）</span><strong id="max-value">—</strong></div>
 <div><span>指标已知／有效函数</span><strong id="known-value">—</strong></div>
</section>
<section class="figure" aria-label="局部二次曲面三维图">
 <div class="figure-top"><strong id="map-title">正在读取…</strong><div class="display-controls"><label><input id="fit-coverage" type="checkbox">拟合覆盖（蓝色）</label><label id="small-gap-option" hidden><input id="small-gap-fill" type="checkbox" checked>补齐小缝（&lt;9 cm²）</label><label id="boundary-option" hidden><input id="boundary-heights" type="checkbox">边界高度差</label><label><input id="cloud-overlay" type="checkbox">原始点</label></div></div>
 <div id="viewport" aria-label="凸多边形裁剪后的二次曲面"></div>
 <div id="loading" role="status">正在加载场景…</div>
 <div class="legend"><span id="metric-legend"><span id="scale-low">0</span><i aria-label="白色低值，红色高值"></i><span id="scale-high">—</span><span class="swatch"><b class="unknown"></b>指标未知</span></span><span id="coverage-legend" class="swatch" hidden><b class="fitted"></b>有效曲面</span><span class="swatch"><b class="unfitted"></b>未通过拟合的中心</span><span class="swatch"><b class="uncovered"></b>无显示曲面</span></div>
</section>
<p id="fit-summary" class="fit-summary"></p>
<p id="boundary-info" class="note" hidden></p>
<div class="selection"><span id="selection-info">点击曲面查看局部函数的数值与边界。</span><button id="clear-selection" hidden>取消选择</button></div>
<p id="metric-note" class="note"></p>
<footer><span id="source-info"></span><a id="csv-link" download>下载本场景数值 CSV</a></footer>
</main><script type="module" src="./viewer.js?v=14"></script></body></html>
