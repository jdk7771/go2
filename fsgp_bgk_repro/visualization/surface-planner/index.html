<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分层投影 A*</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./viewer.css?v=1"><script type="importmap">{"imports":{"three":"../scene-fits/vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"../scene-fits/vendor/OrbitControls.js"}}</script></head><body><main>
<header><div><h1>拟合曲面上的分层 A*</h1><p>落足价值 · 本层滚动 · 交接高差小于 40 cm 时叠加重规划</p></div><a href="/">返回地形评价 ↗</a></header>
<section class="controls"><label>场景<select id="scene"><option value="four-platforms">五平台通行链 · 全程规划</option><option value="layer-choice">封闭通道 · 分层规划</option><option value="hill">丘陵</option><option value="flat">平地</option><option value="table">大桌子 · 桌下与桌面</option><option value="table-low-040">低桌 · 净空 40 cm（绕行）</option><option value="table-low-042">低桌 · 净空 42 cm（降身）</option><option value="table-low-060">低桌 · 净空 60 cm</option><option value="flat-corridor-platforms">高低台 · 本层 / 叠加对比</option><option value="platform-underpass-070">第二台右侧延伸 · 净空 70 cm</option><option value="platform-underpass-042">第二台右侧延伸 · 净空 42 cm（降身）</option><option value="surface-route-test">矮台、立墙与顶板</option></select></label><label>路径<select id="route"></select></label><button id="play">播放</button><label>播放速度<select id="speed"><option value="1">1×</option><option value="3" selected>3×</option><option value="8">8×</option></select></label><button id="follow">近看机器人</button><button id="top">俯视</button><button id="reset">三维</button><label><input type="checkbox" id="points">原始点</label><label hidden><input type="checkbox" id="upper-transparent">透视上层</label><label><input type="checkbox" id="headroom">上方通行 0/1</label></section>
<section class="controls"><label><input type="checkbox" id="projection">投影代价图（XY）</label></section>
<section id="platform-summary" class="platform-summary" hidden></section>
<section id="stats" class="stats"></section><section class="figure"><div id="viewport"></div><div id="loading">正在读取…</div><div class="legend">蓝色：原拟合面　白→红：代价低→高　紫色虚线：跨层连接候选　橙色：机身　绿点：支撑足　紫点：ZMP　上方通行点：绿=1，红=0（XY 净空初筛）</div></section>
<div class="timeline"><input type="range" id="time" min="0" max="1" step="1" value="0" aria-label="轨迹帧"><output id="clock"></output></div><p id="pose-info"></p><p id="result-info"></p>
<p class="note">同层连续曲面按滚动处理，不用跨步高差触发抬腿。叠加地图保留原高度和层编号，只在观测边界建立小于 40 cm 的跨层连接。紫色虚线是规划候选，尚未生成或验证跨层抬腿动作；40 cm 是用户设定门限。</p>
<footer><a href="./workflow.md">完整流程 · 简明说明 ↗</a><a href="./report.md">详细参数与测试 ↗</a><a id="layers" hidden download>层关系与通行状态</a><a id="json" download>下载路径与逐帧检查数据</a><a href="./capability/report.json">历史盲走测试 ↗</a></footer>
</main><script type="module" src="./viewer.js?v=9"></script></body></html>
